repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
      - id: check-yaml
  - repo: https://github.com/homebysix/pre-commit-macadmin
    rev: v1.25.1
    hooks:
      - id: check-plists
      - id: check-autopkg-recipes